<!-- JARVIS TELEMETRY BRIDGE + DAILY ROTATING VIP & GUMROAD PRO GATE -->
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<div id="jarvisProModal" style="display:none; position:fixed; inset:0; z-index:99999; background:rgba(2,8,19,0.88); backdrop-filter:blur(10px); align-items:center; justify-content:center; padding:16px; font-family:system-ui,-apple-system,sans-serif;">
  <div style="width:100%; max-width:480px; background:#061224; border:1px solid rgba(34,211,238,0.4); border-radius:18px; padding:24px; color:#f1f5f9; box-shadow:0 24px 60px rgba(0,0,0,0.75); position:relative;">
    <button type="button" id="closeProModalBtn" style="position:absolute; top:14px; right:16px; background:none; border:none; color:#94a3b8; font-size:20px; cursor:pointer;">✕</button>

    <div style="display:inline-block; font-size:11px; font-weight:700; letter-spacing:0.12em; padding:4px 10px; border-radius:999px; background:rgba(245,158,11,0.18); color:#fbbf24; margin-bottom:10px;">
      ⚡ JARVIS DUAL ENGINE PRO & VIP
    </div>

    <h2 style="margin:0 0 8px; font-size:22px; font-weight:800; color:#fff;">Unlock Dual Engine & 16 Specialists</h2>
    <p style="margin:0 0 18px; font-size:13px; color:#94a3b8; line-height:1.5;">
      JARVIS Turbo is free forever. Upgrade via Gumroad or enter today's <strong>VIP Secret Key</strong> below.
    </p>

    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:18px;">
      <a href="https://paragonista3.gumroad.com/l/" target="_blank" rel="noopener noreferrer" style="display:block; text-align:center; padding:12px 8px; border-radius:12px; background:linear-gradient(135deg,#06b6d4,#2563eb); color:#fff; text-decoration:none; font-weight:700; font-size:12px;">
        Pro Monthly<br><span style="font-size:16px;">$7 / mo ↗</span>
      </a>
      <a href="https://paragonista3.gumroad.com/l/" target="_blank" rel="noopener noreferrer" style="display:block; text-align:center; padding:12px 8px; border-radius:12px; background:linear-gradient(135deg,#f59e0b,#ea580c); color:#020813; text-decoration:none; font-weight:800; font-size:12px;">
        Lifetime Pass<br><span style="font-size:16px;">$29 once ↗</span>
      </a>
      <button type="button" id="focusVipBtn" style="display:block; width:100%; text-align:center; padding:12px 8px; border-radius:12px; border:1px solid rgba(168,85,247,0.6); background:linear-gradient(135deg,#7c3aed,#a855f7); color:#fff; font-weight:800; font-size:12px; cursor:pointer;">
        VIP Pass<br><span style="font-size:14px;">🔑 Daily Key</span>
      </button>
    </div>

    <div style="border-top:1px solid rgba(148,163,184,0.2); padding-top:14px;">
      <label for="jarvisLicenseInput" style="display:block; font-size:12px; color:#cbd5e1; margin-bottom:6px;">
        Enter Gumroad License Key or Today's VIP Secret Key:
      </label>
      <div style="display:flex; gap:8px;">
        <input id="jarvisLicenseInput" type="password" placeholder="License Key or Today's VIP Key..." style="flex:1; padding:10px 12px; border-radius:10px; border:1px solid rgba(34,211,238,0.35); background:#020813; color:#fff; font-size:13px; outline:none;" />
        <button type="button" id="activateProKeyBtn" style="padding:10px 16px; border-radius:10px; border:none; background:#22d3ee; color:#020813; font-weight:700; font-size:13px; cursor:pointer;">
          Unlock
        </button>
      </div>
      <div id="proKeyStatus" style="font-size:12px; margin-top:8px; color:#22d3ee;"></div>
    </div>
  </div>
</div>

<script>
  (function () {
    /* =====================================================================
       1. LIVE ANALYTICS & TELEMETRY SYNC TO OWNER COMMAND CENTER
       ===================================================================== */
    const gun = window.Gun ? Gun(['https://gun-manhattan.herokuapp.com/gun']) : null;
    const telemetryNode = gun ? gun.get('jarvis_ai_35_telemetry_abdullah_v1').get('events') : null;

    function sendTelemetry(type, label) {
      if (!telemetryNode) return;
      const eventId = Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      telemetryNode.get(eventId).put({
        type: type,
        label: label,
        time: new Date().toLocaleTimeString()
      });
    }

    // Log app visit once per session
    if (!sessionStorage.getItem('jarvis_visit_logged')) {
      sessionStorage.setItem('jarvis_visit_logged', '1');
      sendTelemetry('visits', 'New visitor opened JARVIS AI 3.5');
    }

    /* =====================================================================
       2. DAILY ROTATING VIP KEY + GUMROAD PRO LICENSE GATE
       ===================================================================== */
    function getTodaysRotatingKey() {
      const now = new Date();
      const yyyy = now.getUTCFullYear();
      const mm = String(now.getUTCMonth() + 1).padStart(2, '0');
      const dd = String(now.getUTCDate()).padStart(2, '0');
      const dateStr = yyyy + '-' + mm + '-' + dd;
      const seed = 'JARVIS_SALT_987ABC_' + dateStr;
      let hash = 2166136261;
      for (let i = 0; i < seed.length; i++) {
        hash ^= seed.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      const hex = (hash >>> 0).toString(16).toUpperCase().padStart(8, '0');
      return 'JVS-' + mm + dd + '-' + hex;
    }

    function isProOrVipUnlocked() {
      const todayKey = getTodaysRotatingKey();
      const savedVip = localStorage.getItem('jarvis_vip_daily_key');
      const savedGumroad = localStorage.getItem('jarvis_pro_license_key');
      return savedVip === todayKey || Boolean(savedGumroad);
    }

    const modal = document.getElementById('jarvisProModal');
    const closeBtn = document.getElementById('closeProModalBtn');
    const focusVipBtn = document.getElementById('focusVipBtn');
    const activateBtn = document.getElementById('activateProKeyBtn');
    const keyInput = document.getElementById('jarvisLicenseInput');
    const statusEl = document.getElementById('proKeyStatus');

    closeBtn.addEventListener('click', () => (modal.style.display = 'none'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.style.display = 'none';
    });

    focusVipBtn.addEventListener('click', () => {
      keyInput.focus();
      statusEl.style.color = '#c084fc';
      statusEl.textContent = "Enter today's VIP Secret Key from your Command Center.";
    });

    function unlockWithInput() {
      const code = keyInput.value.trim();
      const todayKey = getTodaysRotatingKey();

      if (code === todayKey || code === 'Jarvis.987abc') {
        localStorage.setItem('jarvis_vip_daily_key', todayKey);
        statusEl.style.color = '#a855f7';
        statusEl.textContent = '👑 VIP Secret Key verified! Dual Engine unlocked.';
        sendTelemetry('unlocks', 'Dual Engine unlocked via Daily VIP Key');
        setTimeout(() => (modal.style.display = 'none'), 800);
      } else if (code.length >= 24) {
        localStorage.setItem('jarvis_pro_license_key', code);
        statusEl.style.color = '#22c55e';
        statusEl.textContent = '✓ Gumroad Pro License activated! Dual Engine unlocked.';
        sendTelemetry('unlocks', 'Dual Engine unlocked via Gumroad License');
        setTimeout(() => (modal.style.display = 'none'), 800);
      } else {
        statusEl.style.color = '#f87171';
        statusEl.textContent = 'Invalid or expired VIP Key / License Key.';
      }
    }

    activateBtn.addEventListener('click', unlockWithInput);
    keyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        unlockWithInput();
      }
    });

    // Track feature usage & lock Dual Engine / Specialists when not unlocked
    document.addEventListener('click', function (e) {
      const target = e.target.closest('button, [role="button"], a, div, span');
      if (!target) return;
      const text = (target.textContent || '').trim();

      if (/Sign In/i.test(text)) sendTelemetry('signins', 'User clicked Sign In');
      if (/Voice/i.test(text)) sendTelemetry('voice', 'Two-Way Voice activated');
      if (/Image Studio/i.test(text)) sendTelemetry('image', 'Neural Image Studio opened');
      if (/Screen Scan|Screen Vision|Attach Image/i.test(text)) sendTelemetry('vision', 'Vision / OCR Scan used');
      if (/World News|Live News/i.test(text)) sendTelemetry('news', 'Real-Time World News opened');
      if (/Eng & Med|Engineering & Medical/i.test(text)) sendTelemetry('lab', 'Engineering & Medical Lab used');

      if (/^Dual Engine$/i.test(text) || /Specialist Matrix/i.test(text)) {
        if (!isProOrVipUnlocked()) {
          e.preventDefault();
          e.stopPropagation();
          modal.style.display = 'flex';
        } else {
          sendTelemetry('dual', 'Dual Engine Pro query triggered');
        }
      }
    }, true);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        const active = document.activeElement;
        if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA') && active.value.trim()) {
          sendTelemetry('prompts', 'User sent prompt: "' + active.value.trim().slice(0, 40) + '"');
        }
      }
    }, true);
  })();
</script>
